<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>حسابك</title>
<meta name="theme-color" content="#070304">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/css/base.css">
<style>
  body { padding-bottom: 40px; }
  .pw { max-width: 620px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px 20px; display: grid; gap: 14px; }
  .p-top { display: flex; align-items: center; gap: 10px; }
  .p-top .mark { width: 40px; height: 40px; border-radius: 12px; background: #000; border: 2px solid #fff; overflow: hidden; flex: none; box-shadow: 0 0 0 3px var(--brand-soft); }
  .p-top .mark img { width: 100%; height: 100%; object-fit: cover; }
  .hero { background: radial-gradient(120% 140% at 100% 0%, rgba(255, 70, 81, .55), transparent 60%), linear-gradient(160deg, #3A0A10, #120507); color: #fff; border: 1px solid var(--line-2); border-radius: 28px; padding: 22px 20px; display: grid; gap: 14px; position: relative; overflow: hidden; box-shadow: 0 24px 50px -24px rgba(229, 35, 47, .8); animation: rise .5s both; }
  .hero h1 { font-size: 30px; }
  .hero .bal { display: grid; gap: 2px; }
  .hero .bal span { font-size: 13px; opacity: .7; }
  .hero .bal b { font: 900 44px/1 var(--f-display); font-variant-numeric: tabular-nums; }
  .hero .mini { display: flex; gap: 18px; font-size: 13.5px; opacity: .85; flex-wrap: wrap; }
  .hero .mini b { font-variant-numeric: tabular-nums; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .big { position: relative; overflow: hidden; background: var(--card-grad); border: 1px solid var(--line); border-radius: 22px; padding: 18px 16px; display: grid; gap: 8px; text-align: start; cursor: pointer; font: inherit; color: inherit; box-shadow: var(--shadow); }
  .big:hover { border-color: var(--brand); transform: translateY(-2px); } .big { transition: transform .2s, border-color .2s; }
  .big .i { width: 46px; height: 46px; border-radius: 14px; display: grid; place-items: center; }
  .big b { font: 800 20px var(--f-display); }
  .big small { color: var(--ink-2); font-size: 13px; }
  .rq { background: var(--card-grad); border: 1px solid var(--line); border-radius: 20px; padding: 14px 16px; display: grid; gap: 10px; }
  .steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
  .steps i { height: 6px; border-radius: 3px; background: var(--paper-2); }
  .steps i.on { background: var(--brand-grad); box-shadow: 0 0 8px rgba(229,35,47,.6); }
  .steps i.go { background: var(--go); }
  .steps i.no { background: var(--stop); }
  .rate button { border: 0; background: none; font-size: 30px; cursor: pointer; color: var(--line-2); padding: 0 2px; line-height: 1; }
  .rate button.on { color: var(--hivis); }
  .qty { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .qty:last-child { border-bottom: 0; }
  .step { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 12px; overflow: hidden; }
  .step button { width: 42px; height: 42px; border: 0; background: var(--paper-2); font-size: 20px; font-weight: 700; cursor: pointer; }
  .step input { width: 64px; height: 42px; border: 0; text-align: center; font: 700 17px var(--f-body); background: var(--input); color: var(--ink); }
  .step button { color: var(--ink); }
  .bars { display: flex; align-items: flex-end; gap: 5px; height: 110px; }
  .bars .b { flex: 1; display: grid; grid-template-rows: 1fr auto; height: 100%; gap: 3px; }
  .bars .st { display: flex; align-items: flex-end; gap: 2px; }
  .bars .st i { flex: 1; border-radius: 3px 3px 0 0; min-height: 2px; }
  .bars small { font-size: 10px; color: var(--ink-3); text-align: center; }
  .led { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; font-size: 14.5px; }
  .led:last-child { border-bottom: 0; }
</style>
</head>
<body>
<div id="root"><div class="pw"><div class="empty faint">بيحمّل…</div></div></div>
<script src="/js/kit.js"></script>
<script src="/js/portal.js"></script>
</body>
</html>
